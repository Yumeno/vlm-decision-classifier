[project]
name = "vlm-decision-classifier"
version = "0.1.0"
description = "Local VLM choice-based image classification demo"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pillow",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["classifier_demo*"]
